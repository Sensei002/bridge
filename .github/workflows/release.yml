name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        run: choco install nsis -y
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/desktop
        run: npm install
      - working-directory: apps/desktop
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android release APK (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android API 37 SDK
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - working-directory: apps/android
        run: gradle :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS device archive (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: apps/ios
        run: xcodegen generate
      - name: Archive for iOS device
        working-directory: apps/ios
        run: xcodebuild -project Bridge.xcodeproj -scheme Bridge -destination 'generic/platform=iOS' -archivePath Bridge.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Zip archive
        working-directory: apps/ios
        run: zip -r Bridge-iOS-unsigned.xcarchive.zip Bridge.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-archive
          path: apps/ios/Bridge-iOS-unsigned.xcarchive.zip

  publish:
    name: Publish GitHub Release
    needs: [windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
