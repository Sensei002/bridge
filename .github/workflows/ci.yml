name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core and desktop checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Native Windows egui desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native Windows app
        run: cargo build --release --manifest-path apps/desktop/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-windows-native
          path: target/release/bridge-desktop.exe

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android API 37 SDK
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build Android APK
        working-directory: apps/android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS Simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build iOS Simulator app
        working-directory: apps/ios
        run: xcodebuild -project Bridge.xcodeproj -scheme Bridge -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
