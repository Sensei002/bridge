name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows desktop installer build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Build Windows app
        working-directory: apps/desktop
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-windows-ci
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android API 37 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build Android APK
        working-directory: apps/android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS Simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build iOS Simulator app
        working-directory: apps/ios
        run: xcodebuild -project Bridge.xcodeproj -scheme Bridge -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
