name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core and desktop checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format Rust workspace
        run: cargo fmt --all
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Native Windows egui desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate exact-brand app icons
        run: |
          python -m pip install Pillow
          python scripts/generate_brand_assets.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native Windows app
        run: cargo build --release --manifest-path apps/desktop/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-windows-native
          path: target/release/bridge-desktop.exe

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate exact-brand Android launcher icons
        run: |
          python -m pip install Pillow
          python scripts/generate_brand_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36 SDK and NDK
        run: sdkmanager "platforms;android-36" "ndk;27.2.12479018"
      - name: Build shared Rust mobile library
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -o apps/android/app/src/main/jniLibs build --release -p bridge-mobile
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build Android APK
        working-directory: apps/android
        run: gradle :app:assembleDebug
      - name: Verify Android native library is packaged
        run: test -f apps/android/app/src/main/jniLibs/arm64-v8a/libbridge_mobile.so
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS Simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate exact-brand iOS assets
        run: |
          python -m pip install Pillow
          python scripts/generate_brand_assets.py
      - name: Build shared Rust mobile library
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          cargo build --release --target aarch64-apple-ios -p bridge-mobile
          cargo build --release --target aarch64-apple-ios-sim -p bridge-mobile
          mkdir -p apps/ios/BridgeApp/Frameworks
          lipo -create target/aarch64-apple-ios/release/libbridge_mobile.a target/aarch64-apple-ios-sim/release/libbridge_mobile.a -output apps/ios/BridgeApp/Frameworks/libbridge_mobile.a
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify shared Rust library
        run: test -f apps/ios/BridgeApp/Frameworks/libbridge_mobile.a
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build iOS Simulator app
        working-directory: apps/ios
        run: xcodebuild -project Bridge.xcodeproj -scheme Bridge -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
