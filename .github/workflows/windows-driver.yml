name: Windows Virtual Display Driver (upstream)

on:
  pull_request:
    paths:
      - ".github/workflows/windows-driver.yml"
      - "apps/windows-driver/**"
      - "docs/second-screen-architecture.md"
      - "apps/windows-driver/README.md"
  push:
    branches: [development, stable]
    paths:
      - ".github/workflows/windows-driver.yml"
      - "apps/windows-driver/**"
      - "docs/second-screen-architecture.md"
      - "apps/windows-driver/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-upstream-vdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-upstream-vdd:
    name: Verify upstream signed x64 VDD package
    runs-on: windows-latest
    steps:
      - name: Download pinned x64 driver-only release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/24.10.27/VirtualDisplayDriver-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP "VirtualDisplayDriver-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "UPSTREAM VDD ARCHIVE SHA256: $actual"
          $root = Join-Path $env:RUNNER_TEMP "vdd-x64"
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          "VDD_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VDD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VDD_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Require x64 driver files and verify catalog signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $infs = @(Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File -Filter "*.inf")
          $cats = @(Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File -Filter "*.cat")
          $dlls = @(Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File -Filter "*.dll")
          Write-Host "Extracted file inventory:"
          Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File | ForEach-Object { Write-Host ($_.FullName.Substring($env:VDD_ROOT.Length)) }
          if ($infs.Count -eq 0) { throw "The upstream x64 archive contains no driver INF." }
          if ($cats.Count -eq 0) { throw "The upstream x64 archive contains no driver catalog." }
          if ($dlls.Count -eq 0) { throw "The upstream x64 archive contains no UMDF driver DLL." }
          $validCatalogs = @()
          foreach ($catalog in $cats) {
            $signature = Get-AuthenticodeSignature -LiteralPath $catalog.FullName
            Write-Host "Catalog: $($catalog.FullName)"
            Write-Host "Signature status: $($signature.Status)"
            if ($signature.SignerCertificate) {
              Write-Host "Signer subject: $($signature.SignerCertificate.Subject)"
              Write-Host "Signer thumbprint: $($signature.SignerCertificate.Thumbprint)"
            }
            if ($signature.Status -eq "Valid" -and $signature.SignerCertificate.Subject -match "SignPath Foundation") { $validCatalogs += $catalog }
          }
          if ($validCatalogs.Count -eq 0) { throw "No catalog has a valid Authenticode signature from SignPath Foundation." }
          Write-Host "Verified x64 driver archive SHA-256: $env:VDD_SHA256"
          Write-Host "Found $($infs.Count) INF file(s), $($cats.Count) catalog file(s), and $($dlls.Count) driver DLL(s)."
          Write-Host "Valid SignPath Foundation catalog(s): $($validCatalogs.Count)"

      - name: Upload verified x64 driver archive for inspection
        uses: actions/upload-artifact@v4
        with:
          name: upstream-vdd-x64-24.10.27
          path: ${{ env.VDD_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
