name: Windows Virtual Display Driver (upstream)

on:
  pull_request:
    paths:
      - ".github/workflows/windows-driver.yml"
      - "apps/windows-driver/**"
      - "docs/second-screen-architecture.md"
      - "apps/windows-driver/README.md"
  push:
    branches: [development, stable]
    paths:
      - ".github/workflows/windows-driver.yml"
      - "apps/windows-driver/**"
      - "docs/second-screen-architecture.md"
      - "apps/windows-driver/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-upstream-vdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-upstream-vdd:
    name: Verify upstream signed VDD package
    runs-on: windows-latest
    steps:
      - name: Download pinned upstream release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VDD.Control.25.7.23.zip"
          $expected = "a701f2272e9fcf382849b24f913c6dd07597b3b1116525f2e90182f019609154"
          $archive = Join-Path $env:RUNNER_TEMP "VDD.Control.25.7.23.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Upstream VDD archive SHA-256 mismatch. Expected $expected, received $actual." }
          Write-Host "Verified pinned upstream archive SHA-256: $actual"
          $root = Join-Path $env:RUNNER_TEMP "vdd"
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          "VDD_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VDD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify driver package and catalog signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $infs = @(Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File -Filter "*.inf")
          $cats = @(Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File -Filter "*.cat")
          if ($infs.Count -eq 0) { throw "The pinned upstream archive contains no driver INF." }
          if ($cats.Count -eq 0) { throw "The pinned upstream archive contains no driver catalog." }

          $validCatalogs = @()
          foreach ($catalog in $cats) {
            $signature = Get-AuthenticodeSignature -LiteralPath $catalog.FullName
            Write-Host "Catalog: $($catalog.FullName)"
            Write-Host "Signature status: $($signature.Status)"
            if ($signature.SignerCertificate) {
              Write-Host "Signer subject: $($signature.SignerCertificate.Subject)"
              Write-Host "Signer thumbprint: $($signature.SignerCertificate.Thumbprint)"
            }
            if ($signature.Status -eq "Valid") { $validCatalogs += $catalog }
          }
          if ($validCatalogs.Count -eq 0) { throw "No catalog in the pinned upstream package has a valid Authenticode signature on this Windows runner." }

          Write-Host "Found $($infs.Count) INF file(s) and $($cats.Count) catalog file(s)."
          Write-Host "Valid signed catalog(s): $($validCatalogs.Count)"
          Write-Host "This validates the vendor package signature; it does not yet prove Bridge capture integration or redistribution rights."

      - name: Upload pinned upstream archive for inspection
        uses: actions/upload-artifact@v4
        with:
          name: upstream-vdd-25.7.23
          path: ${{ env.VDD_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
