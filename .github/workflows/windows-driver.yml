name: Windows Virtual Display Driver (upstream)

on:
  pull_request:
    paths:
      - ".github/workflows/windows-driver.yml"
      - "apps/windows-driver/**"
      - "docs/second-screen-architecture.md"
      - "apps/windows-driver/README.md"
      - "scripts/windows/*BridgeVirtualDisplayDriver.ps1"
      - "installer/windows/Package.wxs"
      - "docs/windows-display-service-installation.md"
  push:
    branches: [development, stable]
    paths:
      - ".github/workflows/windows-driver.yml"
      - "apps/windows-driver/**"
      - "docs/second-screen-architecture.md"
      - "apps/windows-driver/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-upstream-vdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-upstream-vdd:
    name: Verify signed VirtualDrivers AMD64 driver-only package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download VirtualDrivers 25.7.23 driver-only package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip"
          $archive = Join-Path $env:RUNNER_TEMP "VirtualDisplayDriver-x86.Driver.Only.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = "e24210692b442b39af763536330ce78b423f19342b7a7792c26de3944e418b3a"
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "VirtualDrivers driver-only archive SHA-256 mismatch. Expected $expected, received $actual." }
          Write-Host "Verified pinned VirtualDrivers driver-only archive SHA256: $actual"
          $root = Join-Path $env:RUNNER_TEMP "virtualdrivers-vdd-driver-only"
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          "VDD_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VDD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify AMD64 binary and SignPath catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dlls = @(Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File -Filter "MttVDD.dll")
          if ($dlls.Count -ne 1) { throw "Expected exactly one MttVDD.dll in driver-only package; found $($dlls.Count)." }
          $driver = $dlls[0].DirectoryName
          $dll = $dlls[0].FullName
          $inf = Join-Path $driver "MttVDD.inf"
          $cat = Join-Path $driver "mttvdd.cat"
          foreach ($path in @($inf, $cat)) { if (-not (Test-Path -LiteralPath $path)) { throw "Expected VDD package file missing: $path" } }
          $bytes = [IO.File]::ReadAllBytes($dll)
          if ($bytes.Length -lt 256 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) { throw "MttVDD.dll is not a valid PE image." }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) { throw "Invalid PE header offset." }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Expected AMD64 driver (0x8664), found PE machine 0x$('{0:X4}' -f $machine)." }
          Write-Host "Verified MttVDD.dll is AMD64 (PE machine 0x8664)."
          $signature = Get-AuthenticodeSignature -LiteralPath $cat
          Write-Host "Catalog signature: $($signature.Status)"
          if ($signature.SignerCertificate) { Write-Host "Signer: $($signature.SignerCertificate.Subject)"; Write-Host "Thumbprint: $($signature.SignerCertificate.Thumbprint)" }
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "SignPath Foundation" -or $signature.SignerCertificate.Thumbprint -ne "3CF8CF26D8BA266C3A483AB7D26D4A818E317D76") { throw "VirtualDrivers catalog signature is not the expected valid SignPath Foundation signature." }
          Write-Host "Driver INF declarations:"
          Select-String -LiteralPath $inf -Pattern "NTamd64|NTx64|NTarm64|NTx86|CatalogFile|Manufacturer|HardwareID" | ForEach-Object { Write-Host $_.Line }

      - name: Verify UMDF package signature with Windows PnP policy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dll = Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File -Filter "MttVDD.dll" | Select-Object -First 1
          $driver = $dll.DirectoryName
          $cat = Join-Path $driver "mttvdd.cat"
          $inf = Join-Path $driver "MttVDD.inf"
          $kits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem -LiteralPath $kits -Recurse -File -Filter "signtool.exe" | Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK x64 SignTool was not found." }
          Write-Host "This is an UMDF user-mode display driver. Verify PnP package signing with /pa, not kernel-mode /kp."
          & $signtool.FullName verify /pa /v /c $cat $inf
          if ($LASTEXITCODE -ne 0) { throw "Driver INF failed Windows PnP catalog verification (exit $LASTEXITCODE)." }
          & $signtool.FullName verify /pa /v /c $cat $dll.FullName
          if ($LASTEXITCODE -ne 0) { throw "Driver DLL failed Windows PnP catalog verification (exit $LASTEXITCODE)." }
          Write-Host "INF and AMD64 UMDF DLL pass Windows PnP package-signing policy."

      - name: Validate Bridge VDD setup script syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = @(
            "scripts/windows/Install-BridgeVirtualDisplayDriver.ps1",
            "scripts/windows/Uninstall-BridgeVirtualDisplayDriver.ps1"
          )
          foreach ($path in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path($($_.Extent.StartLineNumber)): $($_.Message)" }
              throw "PowerShell parser rejected $path."
            }
            Write-Host "PowerShell syntax valid: $path"
          }

      - name: Upload pinned driver-only archive for inspection
        uses: actions/upload-artifact@v4
        with:
          name: virtualdrivers-vdd-amd64-driver-only-25.7.23
          path: ${{ env.VDD_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
