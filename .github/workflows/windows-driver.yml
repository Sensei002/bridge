name: Windows Virtual Display Driver (upstream)

on:
  pull_request:
    paths:
      - ".github/workflows/windows-driver.yml"
      - "apps/windows-driver/**"
      - "docs/second-screen-architecture.md"
      - "apps/windows-driver/README.md"
  push:
    branches: [development, stable]
    paths:
      - ".github/workflows/windows-driver.yml"
      - "apps/windows-driver/**"
      - "docs/second-screen-architecture.md"
      - "apps/windows-driver/README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-upstream-vdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-upstream-vdd:
    name: Verify Parsec signed x64 VDD candidate
    runs-on: windows-latest
    steps:
      - name: Download Parsec VDD 0.45.1 portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/nomi-san/parsec-vdd/releases/download/v0.45.1/ParsecVDisplay-v0.45-portable.zip"
          $archive = Join-Path $env:RUNNER_TEMP "ParsecVDisplay-v0.45-portable.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PARSEC VDD ARCHIVE SHA256: $actual"
          $root = Join-Path $env:RUNNER_TEMP "parsec-vdd"
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          "VDD_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VDD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VDD_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify x64 driver package and vendor catalog signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $infs = @(Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File -Filter "*.inf")
          $cats = @(Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File -Filter "*.cat")
          $dlls = @(Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File -Filter "*.dll")
          Write-Host "Extracted file inventory:"
          Get-ChildItem -LiteralPath $env:VDD_ROOT -Recurse -File | ForEach-Object { Write-Host ($_.FullName.Substring($env:VDD_ROOT.Length)) }
          if ($infs.Count -eq 0 -or $cats.Count -eq 0 -or $dlls.Count -eq 0) { throw "The portable archive is missing an INF, catalog, or driver DLL." }
          $validCatalogs = @()
          foreach ($catalog in $cats) {
            $signature = Get-AuthenticodeSignature -LiteralPath $catalog.FullName
            Write-Host "Catalog: $($catalog.FullName)"
            Write-Host "Signature status: $($signature.Status)"
            if ($signature.SignerCertificate) {
              Write-Host "Signer subject: $($signature.SignerCertificate.Subject)"
              Write-Host "Signer thumbprint: $($signature.SignerCertificate.Thumbprint)"
            }
            if ($signature.Status -eq "Valid") { $validCatalogs += $catalog }
          }
          if ($validCatalogs.Count -eq 0) { throw "No Parsec VDD catalog has a valid Authenticode signature on this Windows runner." }
          $infText = Get-Content -LiteralPath $infs[0].FullName -Raw
          if ($infText -notmatch "NTamd64|NTx64|NT\s*\=\s*amd64") { throw "The driver INF does not declare a recognizable x64/AMD64 install section." }
          Write-Host "Candidate archive SHA-256: $env:VDD_SHA256"
          Write-Host "Found $($infs.Count) INF file(s), $($cats.Count) catalog file(s), and $($dlls.Count) DLL file(s)."
          Write-Host "Valid signed catalog(s): $($validCatalogs.Count)"

      - name: Upload candidate package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: parsec-vdd-0.45.1-candidate
          path: ${{ env.VDD_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7
