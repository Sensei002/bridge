[workspace]
resolver = "2"
members = ["crates/bridge-protocol", "crates/bridge-core", "apps/desktop"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Sensei002/bridge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
