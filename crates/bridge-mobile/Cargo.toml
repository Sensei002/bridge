[package]
name = "bridge-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI and JNI bridge for the native Bridge mobile clients"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
bridge-core = { path = "../bridge-core" }
bridge-network = { path = "../bridge-network" }
bridge-protocol = { path = "../bridge-protocol" }
bridge-security = { path = "../bridge-security" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
snow = "0.9.6"
hex = "0.4"
uuid.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
