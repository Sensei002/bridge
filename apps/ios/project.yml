name: Bridge
options:
  bundleIdPrefix: app.bridge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Bridge:
    type: application
    platform: iOS
    sources:
      - path: BridgeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bridge.ios
        INFOPLIST_KEY_CFBundleDisplayName: Bridge
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Bridge discovers your devices on your local network."
        INFOPLIST_KEY_NSBonjourServices: ["_bridge._tcp"]
        SWIFT_OBJC_BRIDGING_HEADER: BridgeApp/Bridge-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/BridgeApp/Frameworks"
        OTHER_LDFLAGS: "-lbridge_mobile"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
