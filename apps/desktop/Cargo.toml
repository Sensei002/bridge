[package]
name = "bridge-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Bridge desktop client built with Rust and egui"

[dependencies]
bridge-core = { path = "../../crates/bridge-core" }
bridge-protocol = { path = "../../crates/bridge-protocol" }
bridge-security = { path = "../../crates/bridge-security" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
winres = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
