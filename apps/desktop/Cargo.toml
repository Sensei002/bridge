[package]
name = "bridge-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Bridge desktop client built with Rust and egui"

[dependencies]
bridge-core = { path = "../../crates/bridge-core" }
bridge-network = { path = "../../crates/bridge-network" }
bridge-protocol = { path = "../../crates/bridge-protocol" }
bridge-security = { path = "../../crates/bridge-security" }
bridge-transfer = { path = "../../crates/bridge-transfer" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
quick-xml = "0.37"
rfd = "0.15"
serde_json.workspace = true
uuid.workspace = true

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
winres = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_UI_Input_KeyboardAndMouse"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
